name: ESPHome compile
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and compile ESPHome configuration
        uses: esphome/build-action@v7
        with:
          yaml_file: sofarsolar.yaml
          version: stable
