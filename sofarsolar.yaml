esphome:
  name: "sofarsolar"
  on_boot:
    - priority: 250  # after sensors initialize
      then:
        - lambda: |-
            switch (id(passive_submode_id)) {
              case 0: id(passive_submode_string).publish_state("Passive Auto"); break;
              case 1: id(passive_submode_string).publish_state("Passive Charge"); break;
              case 2: id(passive_submode_string).publish_state("Passive Discharge"); break;
              case 3: id(passive_submode_string).publish_state("Passive Export"); break;
              default: id(passive_submode_string).publish_state("Unknown"); break;
            }
    - priority: 600
      then:
        - script.execute: set_passive_timeout            
    - priority: 800
      then:
        - lambda: |-
            int mode = (int)id(current_mode).state;

            std::string label;
            if (mode == 0) label = "Self Use";
            else if (mode == 1) label = "Time Of Use";
            else if (mode == 3) label = "Passive";
            else if (mode == 4) label = "Peak Shaving";
            else label = "Unknown";

            ESP_LOGI("boot", "Syncing battery_inverter_mode_select to '%s' from mode %d", label.c_str(), mode);
            id(battery_inverter_mode_select).publish_state(label);          
esp32:
  board: esp-wrover-kit
  framework:
    type: arduino

substitutions:
  devicename: "sofarsolar"

# Enable logging
logger:
  baud_rate: 0
  level: DEBUG  
  logs:
    modbus_controller: ERROR
    sensor: ERROR
    modbus_controller.sensor: WARN
    modbus_controller.number: WARN
    modbus: WARN

# Enable Home Assistant API
api:

ota:
  platform: esphome

web_server:
  port: 80

time:
  - platform: homeassistant
    id: esptime

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 20.5db
  manual_ip:
    static_ip: 10.10.50.99
    gateway: 10.10.50.254
    subnet: 255.255.255.0  
 
uart:
  id: modbus_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  stop_bits: 1
  parity: NONE
  #debug:
  #  direction: BOTH
  #  dummy_receiver: false
  #  # after:
  #  #   delimiter: [0xF8,0xF7,0xF6,0xF5]
      
modbus:
  send_wait_time: 300ms
  id: modbus1
  flow_control_pin: GPIO4
  uart_id: modbus_uart

modbus_controller:
  - id: sofar_inverter
    address: 0x01
    modbus_id: modbus1
    command_throttle: 150ms
    setup_priority: -10
    update_interval: 15s
#  - id: sofar_inverter_rapid
#    address: 0x01
#    modbus_id: modbus1
#    command_throttle: 150ms
#    setup_priority: -10
#    update_interval: 5s

globals:
  - id: passive_submode_id
    type: uint8_t
    restore_value: true
    initial_value: '0'
  - id: last_blo
    type: int32_t
    restore_value: no
    initial_value: '0'
  - id: last_bup
    type: int32_t
    restore_value: no
    initial_value: '0'
  - id: last_gdes
    type: int32_t
    restore_value: no
    initial_value: '0'

  - id: safe_battery_soc
    type: float
    restore_value: no
    initial_value: '50'
    
  - id: passive_auto_export_recovery_active
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: passive_auto_export_preference_value
    type: float
    restore_value: true
    initial_value: '90'

  - id: passive_auto_inverter_limit_value
    type: float
    restore_value: true
    initial_value: '5200'

  - id: passive_auto_max_charge_power_value
    type: float
    restore_value: true
    initial_value: '3000'

  - id: passive_auto_target_soc_value
    type: float
    restore_value: true
    initial_value: '50'


number:
  - platform: template
    name: "Passive Auto Target SOC"
    id: passive_auto_target_soc
    min_value: 20
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 50
    set_action:
      - lambda: |-
          id(passive_auto_target_soc_value) = x;

  - platform: template
    name: "Passive Auto Export Preference"
    id: passive_auto_export_preference
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 90
    set_action:
      - lambda: |-
          id(passive_auto_export_preference_value) = x;

  - platform: template
    name: "Passive Auto Export Recovery Start SOC"
    id: passive_auto_export_recovery_start_soc
    min_value: 50
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 95

  - platform: template
    name: "Passive Auto Export Recovery Stop SOC"
    id: passive_auto_export_recovery_stop_soc
    min_value: 20
    max_value: 99
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 85

  - platform: template
    name: "Passive Auto Export Recovery Power"
    id: passive_auto_export_recovery_power
    min_value: 500
    max_value: 5000
    step: 100
    unit_of_measurement: "W"
    optimistic: true
    restore_value: true
    initial_value: 2000

  - platform: template
    name: "Passive Auto Export Recovery PV Threshold"
    id: passive_auto_export_recovery_pv_threshold
    min_value: 1000
    max_value: 5200
    step: 100
    unit_of_measurement: "W"
    optimistic: true
    restore_value: true
    initial_value: 4500

  - platform: template
    name: "Passive Auto Inverter Limit"
    id: passive_auto_inverter_limit
    min_value: 3000
    max_value: 5200
    step: 100
    unit_of_measurement: "W"
    optimistic: true
    restore_value: true
    initial_value: 5200
    set_action:
      - lambda: |-
          id(passive_auto_inverter_limit_value) = x;

  - platform: template
    name: "Passive Auto Max Charge Power"
    id: passive_auto_max_charge_power
    min_value: 500
    max_value: 5000
    step: 100
    unit_of_measurement: "W"
    optimistic: true
    restore_value: true
    initial_value: 3000
    set_action:
      - lambda: |-
          id(passive_auto_max_charge_power_value) = x;

  - platform: template
    name: "Scheduled Charge Power"
    id: passive_charge_power
    min_value: 500
    max_value: 5000
    restore_value: True
    step: 100
    mode: box
    unit_of_measurement: "W"
    optimistic: true

  - platform: template
    name: "Scheduled Charge Target SoC"
    id: scheduled_charge_target_soc
    min_value: 10
    max_value: 100
    restore_value: True
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    mode: box

  - platform: template
    name: "Passive Charge Power"
    id: manual_passive_charge_power
    min_value: 500
    max_value: 5000
    restore_value: true
    step: 100
    mode: box
    unit_of_measurement: "W"
    optimistic: true

  - platform: template
    name: "Passive Charge Target SoC"
    id: manual_passive_charge_target_soc
    min_value: 10
    max_value: 100
    restore_value: true
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    mode: box

  - platform: template
    name: "Passive Discharge Power"
    id: passive_discharge_power
    min_value: 500
    max_value: 5000
    restore_value: true
    step: 100
    mode: box
    unit_of_measurement: "W"
    optimistic: true

  - platform: template
    name: "Passive Discharge Minimum SoC"
    id: passive_discharge_min_soc
    min_value: 5
    max_value: 100
    restore_value: true
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    mode: box

  - platform: template
    name: "Passive Discharge Export Power"
    id: passive_discharge_export_power
    min_value: 0
    max_value: 5000
    restore_value: true
    step: 100
    unit_of_measurement: "W"
    optimistic: true
    mode: box

  - platform: template
    name: "Passive Export Minimum SoC"
    id: passive_export_min_soc
    min_value: 5
    max_value: 100
    restore_value: true
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    mode: box

  - platform: template
    name: "Passive Export Power"
    id: passive_export_power
    min_value: 0
    max_value: 5000
    restore_value: true
    step: 100
    unit_of_measurement: "W"
    optimistic: true
    mode: box

  - platform: modbus_controller
    id: inverter_storage_mode_number
    name: "Inverter Storage Mode"
    address: 0x1110
    register_type: holding
    value_type: U_WORD
    min_value: 0
    max_value: 5
    step: 1
    use_write_multiple: true
    modbus_controller_id: sofar_inverter
    on_value:
      then:
        - logger.log:
            format: "Inverter Storage Mode updated: %.0f"
            args: ["x"]
        - lambda: |-
            id(current_mode).publish_state((int)x);

select:
  - platform: template
    name: "Battery/Inverter Mode"
    id: battery_inverter_mode_select
    optimistic: true
    restore_value: true
    options:
      - "Self Use"
      - "Time Of Use"
      - "Passive"
      - "Peak Shaving"
    set_action:
      then:
        - lambda: |-
            std::string mode = x.c_str();
            int inverter_mode = 3;
            if (mode == "Self Use") inverter_mode = 0;
            else if (mode == "Time Of Use") inverter_mode = 1;
            else if (mode == "Passive") inverter_mode = 3;
            else if (mode == "Peak Shaving") inverter_mode = 4;
            else return;

            if ((int)id(current_mode).state != inverter_mode) {
              id(inverter_storage_mode_number).make_call().set_value(inverter_mode).perform();
              id(current_mode).publish_state(inverter_mode);
            }

            id(battery_mode_string).publish_state(mode);

        - if:
            condition:
              lambda: 'return x == "Passive";'
            then:
              - select.set:
                  id: passive_mode_subselect
                  option: "Passive (Auto)"
              - script.execute:
                  id: apply_passive_submode
                  submode: "Passive (Auto)"

  - platform: template
    name: "Passive Mode Subtype"
    id: passive_mode_subselect
    optimistic: true
    restore_value: true
    options:
      - "Passive (Auto)"
      - "Passive Charge"
      - "Passive Discharge"
      - "Passive Export"
    initial_option: "Passive (Auto)"
    set_action:
      then:
        - lambda: |-
            ESP_LOGI("passive_subselect", "Selected passive submode: %s", x.c_str());
            id(passive_submode_string).publish_state(x);

            if (x == "Passive (Auto)") {
              id(passive_submode_id) = 0;
            } else if (x == "Passive Charge") {
              id(passive_submode_id) = 1;
            } else if (x == "Passive Discharge") {
              id(passive_submode_id) = 2;
            } else if (x == "Passive Export") {
              id(passive_submode_id) = 3;
            }

            if ((int)id(current_mode).state != 3) {
              ESP_LOGI("passive_subselect", "Switching main inverter mode to Passive (3)");
              id(inverter_storage_mode_number).make_call().set_value(3).perform();
              id(current_mode).publish_state(3);
              id(battery_mode_string).publish_state("Passive");
            }
        - delay: 500ms
        - script.execute:
            id: apply_passive_submode
            submode: !lambda 'return x;'

### Begin Script Block

script:
  - id: set_passive_timeout
    mode: single
    then:
      - lambda: |-
          const uint16_t timeout_value = 300;  // in seconds
          const uint16_t timeout_action = 1;   // 1 = return to energy storage mode

          std::vector<uint8_t> cmd = {
            0x01, 0x10,
            0x11, 0x84,
            0x00, 0x02,
            0x04,
            (uint8_t)(timeout_value >> 8), (uint8_t)(timeout_value & 0xFF),
            (uint8_t)(timeout_action >> 8), (uint8_t)(timeout_action & 0xFF)
          };

          id(modbus1).send_raw(cmd);
          ESP_LOGI("timeout", "Passive timeout set: %ds with action %d", timeout_value, timeout_action);

  - id: apply_passive_submode
    mode: restart
    parameters:
      submode: string
    then:
      - lambda: |-
          id(passive_submode_string).publish_state(submode);

          const uint16_t BASE_REGISTER = 0x1187;

          int32_t gdes = 0;
          int32_t blo = 0;
          int32_t bup = 0;

          if (submode == "Passive Charge") {
            int32_t charge_power = (int32_t) id(manual_passive_charge_power).state;
            gdes = 0;
            blo = charge_power;
            bup = charge_power;

          } else if (submode == "Passive Discharge") {
            int32_t discharge_power = (int32_t) id(passive_discharge_power).state;
            gdes = 0;
            blo = -discharge_power;
            bup = -discharge_power;

          } else if (submode == "Passive Export") {
            int32_t export_power = (int32_t) id(passive_export_power).state;
            gdes = -export_power;
            blo = -export_power;
            bup = -export_power;

          } else if (submode == "Passive (Auto)") {
            gdes = 0;
            blo = -5000;
            bup = 5000;

          } else {
            ESP_LOGI("passive_mode", "Unknown passive submode '%s' - skipping manual write.", submode.c_str());
            return;
          }

          std::vector<uint8_t> payload = {
            (uint8_t)(gdes >> 24), (uint8_t)(gdes >> 16),
            (uint8_t)(gdes >> 8),  (uint8_t)(gdes & 0xFF),
            (uint8_t)(blo >> 24),  (uint8_t)(blo >> 16),
            (uint8_t)(blo >> 8),   (uint8_t)(blo & 0xFF),
            (uint8_t)(bup >> 24),  (uint8_t)(bup >> 16),
            (uint8_t)(bup >> 8),   (uint8_t)(bup & 0xFF)
          };

          std::vector<uint8_t> cmd = {
            0x01, 0x10,
            (uint8_t)(BASE_REGISTER >> 8), (uint8_t)(BASE_REGISTER & 0xFF),
            0x00, 0x06, 0x0C
          };

          cmd.insert(cmd.end(), payload.begin(), payload.end());
          id(modbus1).send_raw(cmd);

          ESP_LOGI("passive_subselect", "Sent 6-register block (Gdes: %d, Blo: %d, Bup: %d)", gdes, blo, bup);

### End Script Block


### Begin Interval Block
interval:
  - interval: 5s
    id: passive_control_loop
    then:
      - lambda: |-
          auto publish_decision = [&](const std::string &decision) {
            id(passive_control_decision).publish_state(decision);
          };

          auto publish_register_target = [&](int32_t gdes, int32_t blo, int32_t bup) {
            char buffer[96];
            snprintf(buffer, sizeof(buffer), "GDES=%dW BLO=%dW BUP=%dW", gdes, blo, bup);
            id(passive_control_register_target).publish_state(buffer);
          };

          if ((int)id(current_mode).state != 3) {
            publish_decision("Inactive - inverter not in Passive mode");
            return;
          }

          uint8_t submode = id(passive_submode_id);

          // Manual Passive Export
          if (submode == 3) {
            float raw_soc = id(inverter_soc_bat).state;

            if (!isnan(raw_soc) && raw_soc >= 5.0f && raw_soc <= 100.0f) {
              id(safe_battery_soc) = raw_soc;
            }

            float soc = id(safe_battery_soc);
          
            float min_soc = id(passive_export_min_soc).state;

            if (soc <= min_soc) {
              publish_decision("Manual Export - min SOC reached, reverting to Passive Auto");

              ESP_LOGI("passive_export", "SOC %.1f%% <= min %.1f%%, reverting Export to Passive Auto", soc, min_soc);

              id(passive_submode_id) = 0;
              id(passive_submode_string).publish_state("Passive Auto");
              id(passive_mode_subselect).publish_state("Passive (Auto)");
              id(battery_mode_string).publish_state("Passive");
              id(scheduled_charge_status).publish_state("Inactive");

              int32_t gdes = 0, blo = -5000, bup = 5000;
              publish_register_target(gdes, blo, bup);

              std::vector<uint8_t> payload = {
                (uint8_t)(gdes >> 24), (uint8_t)(gdes >> 16), (uint8_t)(gdes >> 8), (uint8_t)(gdes & 0xFF),
                (uint8_t)(blo >> 24),  (uint8_t)(blo >> 16),  (uint8_t)(blo >> 8),  (uint8_t)(blo & 0xFF),
                (uint8_t)(bup >> 24),  (uint8_t)(bup >> 16),  (uint8_t)(bup >> 8),  (uint8_t)(bup & 0xFF)
              };

              std::vector<uint8_t> cmd = {0x01, 0x10, 0x11, 0x87, 0x00, 0x06, 0x0C};
              cmd.insert(cmd.end(), payload.begin(), payload.end());
              id(modbus1).send_raw(cmd);

              id(last_blo) = blo;
              id(last_bup) = bup;
              id(last_gdes) = gdes;
              return;
            }

            int32_t export_power = (int32_t)id(passive_export_power).state;
            int32_t gdes = -export_power;
            int32_t blo = -export_power;
            int32_t bup = -export_power;

            publish_decision("Manual Export - forcing battery export");
            publish_register_target(gdes, blo, bup);

            if (blo != id(last_blo) || bup != id(last_bup) || gdes != id(last_gdes)) {
              std::vector<uint8_t> payload = {
                (uint8_t)(gdes >> 24), (uint8_t)(gdes >> 16), (uint8_t)(gdes >> 8), (uint8_t)(gdes & 0xFF),
                (uint8_t)(blo >> 24),  (uint8_t)(blo >> 16),  (uint8_t)(blo >> 8),  (uint8_t)(blo & 0xFF),
                (uint8_t)(bup >> 24),  (uint8_t)(bup >> 16),  (uint8_t)(bup >> 8),  (uint8_t)(bup & 0xFF)
              };

              std::vector<uint8_t> cmd = {0x01, 0x10, 0x11, 0x87, 0x00, 0x06, 0x0C};
              cmd.insert(cmd.end(), payload.begin(), payload.end());
              id(modbus1).send_raw(cmd);

              id(last_blo) = blo;
              id(last_bup) = bup;
              id(last_gdes) = gdes;
            }
            return;
          }

          // Manual Passive Discharge
          if (submode == 2) {
            float soc = id(inverter_soc_bat).state;
            float min_soc = id(passive_discharge_min_soc).state;
            int32_t discharge_power = (int32_t)id(passive_discharge_power).state;
            int32_t export_allowance = (int32_t)id(passive_discharge_export_power).state;

            if (soc <= min_soc) {
              publish_decision("Manual Discharge - min SOC reached, reverting to Passive Auto");

              ESP_LOGI("passive_discharge", "SOC %.1f%% <= min %.1f%%, reverting Discharge to Passive Auto", soc, min_soc);

              id(passive_submode_id) = 0;
              id(passive_submode_string).publish_state("Passive Auto");
              id(passive_mode_subselect).publish_state("Passive (Auto)");
              id(battery_mode_string).publish_state("Passive");
              id(scheduled_charge_status).publish_state("Inactive");

              int32_t gdes = 0, blo = -5000, bup = 5000;
              publish_register_target(gdes, blo, bup);

              std::vector<uint8_t> payload = {
                (uint8_t)(gdes >> 24), (uint8_t)(gdes >> 16), (uint8_t)(gdes >> 8), (uint8_t)(gdes & 0xFF),
                (uint8_t)(blo >> 24),  (uint8_t)(blo >> 16),  (uint8_t)(blo >> 8),  (uint8_t)(blo & 0xFF),
                (uint8_t)(bup >> 24),  (uint8_t)(bup >> 16),  (uint8_t)(bup >> 8),  (uint8_t)(bup & 0xFF)
              };

              std::vector<uint8_t> cmd = {0x01, 0x10, 0x11, 0x87, 0x00, 0x06, 0x0C};
              cmd.insert(cmd.end(), payload.begin(), payload.end());
              id(modbus1).send_raw(cmd);

              id(last_blo) = blo;
              id(last_bup) = bup;
              id(last_gdes) = gdes;
              return;
            }

            float house_load_w = id(inverter_ac_power_load).state;
            if (isnan(house_load_w) || house_load_w < 0) house_load_w = 0;

            int32_t max_allowed_discharge = (int32_t)house_load_w + export_allowance;
            int32_t applied_discharge = std::min(discharge_power, max_allowed_discharge);

            int32_t gdes = 0;
            int32_t blo = -applied_discharge;
            int32_t bup = -applied_discharge;

            publish_decision("Manual Discharge - discharging to cover load/export allowance");
            publish_register_target(gdes, blo, bup);

            if (blo != id(last_blo) || bup != id(last_bup) || gdes != id(last_gdes)) {
              std::vector<uint8_t> payload = {
                (uint8_t)(gdes >> 24), (uint8_t)(gdes >> 16), (uint8_t)(gdes >> 8), (uint8_t)(gdes & 0xFF),
                (uint8_t)(blo >> 24),  (uint8_t)(blo >> 16),  (uint8_t)(blo >> 8),  (uint8_t)(blo & 0xFF),
                (uint8_t)(bup >> 24),  (uint8_t)(bup >> 16),  (uint8_t)(bup >> 8),  (uint8_t)(bup & 0xFF)
              };

              std::vector<uint8_t> cmd = {0x01, 0x10, 0x11, 0x87, 0x00, 0x06, 0x0C};
              cmd.insert(cmd.end(), payload.begin(), payload.end());
              id(modbus1).send_raw(cmd);

              id(last_blo) = blo;
              id(last_bup) = bup;
              id(last_gdes) = gdes;
            }
            return;
          }

          // Passive Auto + Scheduled Charge
          auto now = id(esptime).now();
          int now_minutes = now.hour * 60 + now.minute;
          int start_minutes = (int)id(scheduled_charge_start_hour).state * 60 + (int)id(scheduled_charge_start_minute).state;
          int end_minutes = (int)id(scheduled_charge_end_hour).state * 60 + (int)id(scheduled_charge_end_minute).state;

          float soc = id(inverter_soc_bat).state;
          float scheduled_target_soc = id(scheduled_charge_target_soc).state;
          float passive_auto_target_soc_setting = id(passive_auto_target_soc_value);
          float pv = id(inverter_pv_power).state;
          float house_load_w = id(inverter_ac_power_load).state;

          if (isnan(soc)) soc = 0;
          if (isnan(scheduled_target_soc)) scheduled_target_soc = 100;
          if (isnan(passive_auto_target_soc_setting)) passive_auto_target_soc_setting = 50;
          if (isnan(pv) || pv < 0) pv = 0;
          if (isnan(house_load_w) || house_load_w < 0) house_load_w = 0;

          bool within_schedule = (start_minutes <= end_minutes)
              ? (now_minutes >= start_minutes && now_minutes < end_minutes)
              : (now_minutes >= start_minutes || now_minutes < end_minutes);

          int32_t gdes = 0;
          int32_t blo = 0;
          int32_t bup = 0;

          if (within_schedule) {
            if (soc < scheduled_target_soc) {
              int32_t charge_power = (int32_t)id(passive_charge_power).state;
              blo = charge_power;
              bup = charge_power;

              publish_decision("Scheduled Charge - charging to target SOC");

              if (id(scheduled_charge_status).state != "Active") {
                id(scheduled_charge_status).publish_state("Active");
                id(passive_submode_id) = 0;
                id(passive_submode_string).publish_state("Passive Auto");
                id(battery_mode_string).publish_state("Passive");
                ESP_LOGI("scheduled_charge", "Scheduled charge active → %dW", charge_power);
              }
            } else {
              blo = 0;
              bup = 0;

              publish_decision("Scheduled Charge - target SOC reached, holding battery");

              if (id(scheduled_charge_status).state != "Active") {
                id(scheduled_charge_status).publish_state("Active");
                id(passive_submode_id) = 0;
                id(passive_submode_string).publish_state("Passive Auto");
                id(battery_mode_string).publish_state("Passive");
                ESP_LOGI("scheduled_charge", "SOC %.1f%% >= %.1f%% → Battery holding", soc, scheduled_target_soc);
              }
            }

          } else {
            if (id(scheduled_charge_status).state != "Inactive") {
              id(scheduled_charge_status).publish_state("Inactive");
              id(passive_submode_id) = 0;
              id(passive_submode_string).publish_state("Passive Auto");
              id(battery_mode_string).publish_state("Passive");
              ESP_LOGI("scheduled_charge", "Schedule ended → Passive Auto");
            }

            float inverter_limit_w = id(passive_auto_inverter_limit_value);
            float max_charge_w = id(passive_auto_max_charge_power_value);
            float export_preference = id(passive_auto_export_preference_value);

            if (isnan(inverter_limit_w) || inverter_limit_w <= 0) inverter_limit_w = 5200;
            if (isnan(max_charge_w) || max_charge_w <= 0) max_charge_w = 3000;
            if (isnan(export_preference)) export_preference = 90;

            if (export_preference < 0) export_preference = 0;
            if (export_preference > 100) export_preference = 100;

            const float near_limit_margin_w = 300.0f;
            const float min_harvest_charge_w = 500.0f;
            const float min_write_charge_w = 200.0f;
            const float surplus_threshold_w = 200.0f;

            bool pv_near_limit = pv >= (inverter_limit_w - near_limit_margin_w);
            bool battery_full = soc >= 99.0f;

            float available_pv_after_load = pv - house_load_w;
            if (available_pv_after_load < 0) available_pv_after_load = 0;

            float clipping_surplus_w = pv - inverter_limit_w;
            if (clipping_surplus_w < 0) clipping_surplus_w = 0;

            float preference_charge_w =
              available_pv_after_load * ((100.0f - export_preference) / 100.0f);

            // Passive Auto Export Recovery
            bool recovery_enabled = id(passive_auto_export_recovery).state;
            bool recovery_active = id(passive_auto_export_recovery_active);

            float recovery_start_soc = id(passive_auto_export_recovery_start_soc).state;
            float recovery_stop_soc = id(passive_auto_export_recovery_stop_soc).state;
            float recovery_power = id(passive_auto_export_recovery_power).state;
            float recovery_pv_threshold = id(passive_auto_export_recovery_pv_threshold).state;

            if (isnan(recovery_start_soc)) recovery_start_soc = 95;
            if (isnan(recovery_stop_soc)) recovery_stop_soc = 85;
            if (isnan(recovery_power)) recovery_power = 2000;
            if (isnan(recovery_pv_threshold)) recovery_pv_threshold = 4500;

            bool pv_low_enough_for_recovery = pv < recovery_pv_threshold;

            if (recovery_enabled) {
              if (!recovery_active && soc >= recovery_start_soc && pv_low_enough_for_recovery) {
                id(passive_auto_export_recovery_active) = true;
                recovery_active = true;

                ESP_LOGI("passive_auto_export_recovery",
                         "Starting: SOC %.1f%% >= %.1f%% and PV %.0fW < %.0fW",
                         soc, recovery_start_soc, pv, recovery_pv_threshold);
              }

              if (recovery_active && (soc <= recovery_stop_soc || pv_near_limit)) {
                id(passive_auto_export_recovery_active) = false;
                recovery_active = false;

                ESP_LOGI("passive_auto_export_recovery",
                         "Stopping: SOC %.1f%%, stop %.1f%%, PV %.0fW, near_limit=%s",
                         soc, recovery_stop_soc, pv, pv_near_limit ? "yes" : "no");
              }
            } else {
              if (recovery_active) {
                id(passive_auto_export_recovery_active) = false;
                recovery_active = false;
                ESP_LOGI("passive_auto_export_recovery", "Disabled → stopping recovery");
              }
            }

            if (recovery_active) {
              int32_t export_power = (int32_t)recovery_power;

              if (export_power < 500) export_power = 500;
              if (export_power > 5000) export_power = 5000;

              gdes = -export_power;
              blo = -export_power;
              bup = -export_power;

              publish_decision("Passive Auto - export recovery active");

              ESP_LOGI("passive_auto_export_recovery",
                       "Active → exporting %dW. SOC %.1f%%, PV %.0fW, Load %.0fW",
                       export_power, soc, pv, house_load_w);

              } else if (pv_near_limit) {
              if (battery_full) {
                blo = 0;
                bup = 0;

                publish_decision("Passive Auto - near limit but battery full, holding battery");

                ESP_LOGI("passive_auto",
                         "Near limit but battery full → hold battery. PV=%.0fW Load=%.0fW SOC=%.1f%%",
                         pv, house_load_w, soc);
              }
              else {
                // existing calculated_charge_w logic goes here
              }
              float calculated_charge_w = std::max(clipping_surplus_w, preference_charge_w);

              if (calculated_charge_w < min_harvest_charge_w) calculated_charge_w = min_harvest_charge_w;
              if (calculated_charge_w > max_charge_w) calculated_charge_w = max_charge_w;
              if (calculated_charge_w > available_pv_after_load) calculated_charge_w = available_pv_after_load;
              if (calculated_charge_w < 0) calculated_charge_w = 0;

              int32_t charge_power = ((int32_t)(calculated_charge_w / 100.0f)) * 100;
              if (charge_power < min_write_charge_w) charge_power = 0;

              if (charge_power > 0) {
                blo = charge_power;
                bup = charge_power;

                publish_decision("Passive Auto - near inverter limit, charging to absorb surplus");

                ESP_LOGI("passive_auto",
                         "Near limit → charge %dW. Target SOC ignored. PV=%.0fW Load=%.0fW InvLimit=%.0fW ExportPref=%.1f%% SOC=%.1f%% Target=%.1f%%",
                         charge_power, pv, house_load_w, inverter_limit_w, export_preference, soc, passive_auto_target_soc_setting);
              } else {
                blo = -5000;
                bup = 5000;

                publish_decision("Passive Auto - near limit but no useful surplus, released");

                ESP_LOGI("passive_auto",
                         "Near limit but no useful charge → release. PV=%.0fW Load=%.0fW SOC=%.1f%%",
                         pv, house_load_w, soc);
              }

            } else {
              bool pv_surplus = available_pv_after_load > surplus_threshold_w;
              bool above_headroom_target = soc >= passive_auto_target_soc_setting;

              if (pv_surplus && above_headroom_target && !battery_full) {
                if (recovery_enabled) {
                  int32_t recovery_discharge_power = (int32_t)id(passive_auto_export_recovery_power).state;

                  if (recovery_discharge_power < 500) recovery_discharge_power = 500;
                  if (recovery_discharge_power > 5000) recovery_discharge_power = 5000;

                  gdes = -recovery_discharge_power;
                  blo = -recovery_discharge_power;
                  bup = -recovery_discharge_power;

                  publish_decision("Passive Auto - recovery enabled, released to recover headroom");

                  ESP_LOGI("passive_auto",
                          "Recovery enabled above target → release for headroom recovery. PV=%.0fW Load=%.0fW Surplus=%.0fW SOC=%.1f%% Target=%.1f%%",
                          pv, house_load_w, available_pv_after_load, soc, passive_auto_target_soc_setting);
                } else {
                  blo = 0;
                  bup = 0;

                  publish_decision("Passive Auto - recovery disabled, holding battery and exporting surplus");

                  ESP_LOGI("passive_auto",
                          "Recovery disabled above target → hold battery/export surplus. PV=%.0fW Load=%.0fW Surplus=%.0fW SOC=%.1f%% Target=%.1f%%",
                          pv, house_load_w, available_pv_after_load, soc, passive_auto_target_soc_setting);
                }

              } else {
                blo = -5000;
                bup = 5000;

                publish_decision("Passive Auto - normal release");

                ESP_LOGI("passive_auto",
                         "Normal release. PV=%.0fW Load=%.0fW NearLimit=%s Surplus=%.0fW SOC=%.1f%% Target=%.1f%%",
                         pv, house_load_w, pv_near_limit ? "yes" : "no",
                         available_pv_after_load, soc, passive_auto_target_soc_setting);
              }
            }
          }

          publish_register_target(gdes, blo, bup);

          if (blo != id(last_blo) || bup != id(last_bup) || gdes != id(last_gdes)) {
            std::vector<uint8_t> payload = {
              (uint8_t)(gdes >> 24), (uint8_t)(gdes >> 16), (uint8_t)(gdes >> 8), (uint8_t)(gdes & 0xFF),
              (uint8_t)(blo >> 24),  (uint8_t)(blo >> 16),  (uint8_t)(blo >> 8),  (uint8_t)(blo & 0xFF),
              (uint8_t)(bup >> 24),  (uint8_t)(bup >> 16),  (uint8_t)(bup >> 8),  (uint8_t)(bup & 0xFF)
            };

            std::vector<uint8_t> cmd = {0x01, 0x10, 0x11, 0x87, 0x00, 0x06, 0x0C};
            cmd.insert(cmd.end(), payload.begin(), payload.end());
            id(modbus1).send_raw(cmd);

            ESP_LOGI("passive_mode", "Grid=%dW BLO=%dW BUP=%dW SOC=%.1f%% PV=%.1fW Load=%.1fW",
                     gdes, blo, bup, soc, pv, house_load_w);

            id(last_blo) = blo;
            id(last_bup) = bup;
            id(last_gdes) = gdes;
          }
### End Interval Block

