    value_type: U_DWORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
 
  - platform: modbus_controller
    modbus_controller_id: sofar_inverter
    name: Import Daily
    id: inverter_import_daily
    state_class: total_increasing
    register_type: holding
    address: 0x068C
    unit_of_measurement: "kWh"
    device_class: "energy"
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - lambda: |-
          static float last = NAN;

          if (isnan(x) || x < 0 || x > 60) {
            return NAN;
          }

          if (!isnan(last)) {
            float delta = x - last;

            // Reject impossible upward jumps
            if (delta > 2.0) {
              ESP_LOGW("energy_filter", "Rejecting Import Daily jump: %.2f -> %.2f kWh", last, x);
              return NAN;
            }

            // Allow daily reset
            if (delta < -10.0) {
              last = x;
              return x;
            }
          }

          last = x;
          return x;

