    device_class: "energy"
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - lambda: |-
          static float last = NAN;

          if (isnan(x) || x < 0 || x > 60) {
            return NAN;
          }

          if (!isnan(last)) {
            float delta = x - last;

            // Reject impossible upward jumps
            if (delta > 2.0) {
              ESP_LOGW("energy_filter", "Rejecting Import Daily jump: %.2f -> %.2f kWh", last, x);
              return NAN;
            }

            // Allow daily reset
            if (delta < -10.0) {
              last = x;
              return x;
            }
          }

          last = x;
          return x;

